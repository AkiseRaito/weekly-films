const list = document.getElementById('list');
const empty = document.getElementById('empty');
let desc = true, expandAll = false;

function card(it, idx) {
  const d = document.createElement('div');
  d.className = 'it';
  d.style.setProperty('--i', idx);

  const hd = document.createElement('div');
  hd.className = 'hd';
  hd.innerHTML =
    '<span class="no">' + (it.no ? '第 ' + it.no + ' 期' : '第 — 期') + '</span>' +
    '<span class="dt">' + it.date + '</span>' +
    '<span class="th"></span>' +
    '<span class="cnt">' + it.movies.length + ' 部</span>' +
    '<span class="arw">▶</span>';
  hd.querySelector('.th').textContent = it.theme || '';

  const bd = document.createElement('div');
  bd.className = 'bd';
  const inner = document.createElement('div');
  inner.className = 'bd-in';
  const ol = document.createElement('ol');
  ol.className = 'ms';
  it.movies.forEach(function (m, i) {
    const li = document.createElement('li');
    const em = document.createElement('i');
    em.textContent = String(i + 1).padStart(2, '0');
    li.appendChild(em);
    li.appendChild(document.createTextNode(m));
    ol.appendChild(li);
  });
  const a = document.createElement('a');
  a.className = 'go';
  a.href = it.file;
  a.textContent = '打开本期 →';
  inner.appendChild(ol);
  inner.appendChild(a);
  bd.appendChild(inner);

  hd.onclick = function () {
    const open = d.classList.toggle('open');
    bd.style.maxHeight = open ? (inner.scrollHeight + 4) + 'px' : '0px';
  };
  d._open = function (on) {
    d.classList.toggle('open', on);
    bd.style.maxHeight = on ? (inner.scrollHeight + 4) + 'px' : '0px';
  };

  d.appendChild(hd);
  d.appendChild(bd);
  return d;
}

function render() {
  const kw = (document.getElementById('q').value || '').trim().toLowerCase();
  const arr = DATA.slice().sort(function (a, b) {
    return desc ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date);
  });
  list.innerHTML = '';
  let n = 0;
  arr.forEach(function (it) {
    const hay = (it.date + ' ' + it.no + ' ' + it.theme + ' ' + it.movies.join(' ')).toLowerCase();
    if (kw && hay.indexOf(kw) < 0) return;
    const c = card(it, n);
    list.appendChild(c);
    if (expandAll) c._open(true);
    n++;
  });
  empty.style.display = n ? 'none' : 'block';
}

document.getElementById('sortBtn').onclick = function () {
  desc = !desc;
  document.getElementById('sortTxt').textContent = desc ? '倒序（新 → 旧）' : '正序（旧 → 新）';
  render();
};
document.getElementById('allBtn').onclick = function () {
  expandAll = !expandAll;
  this.innerHTML = expandAll ? '收起全部' : '展开全部';
  render();
};
document.getElementById('q').oninput = render;
window.addEventListener('resize', function () {
  document.querySelectorAll('.it.open .bd').forEach(function (b) {
    b.style.maxHeight = (b.firstChild.scrollHeight + 4) + 'px';
  });
});
render();
</script>
